[project]
name = "komoot-mcp"
version = "0.1.0"
description = "Komoot browsing, routing, GPX import and prepared-artifact publication over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30.0,<2",
    # Tour._create_* internals are used by the client.
    "kompy>=0.0.12,<0.1",
    "gpxpy>=1.6.0",
    "requests>=2.31.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Repository = "https://github.com/realholgi/komoot-mcp"
Documentation = "https://github.com/realholgi/komoot-mcp#readme"
Issues = "https://github.com/realholgi/komoot-mcp/issues"

[project.scripts]
komoot-mcp = "komoot_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "build>=1.2",
    "twine>=6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
